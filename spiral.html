<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiral rasm</title>
<style>
:root{--bg:#000;--red:#f22619;--ink:#ffe9ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
body{display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%}
.bar{display:flex;gap:8px;padding:12px;align-items:center}
input[type=text]{flex:1;min-width:0;background:#1a0d10;color:var(--ink);border:1px solid #4a1d25;border-radius:10px;padding:12px;font:inherit}
input[type=file]{max-width:50%;color:var(--ink);font:14px system-ui,sans-serif}
input[type=file]::file-selector-button{background:var(--red);color:#1a0508;border:0;border-radius:10px;padding:12px 14px;font:700 15px system-ui,sans-serif;margin-right:8px;cursor:pointer}
</style>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Rasmdan yasalgan qizil matn spirali"></canvas></div>
<div class="bar">
  <input type="text" id="t" value="SENI SEVAMAN " maxlength="40" aria-label="Spiral matni">
  <input type="file" id="f" accept="image/*" aria-label="Rasm tanlang">
</div>
<script>
const cv=document.getElementById("c"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf,img=null,S=0;
function size(){const st=cv.parentElement.getBoundingClientRect();S=Math.floor(Math.min(st.width,st.height));const d=devicePixelRatio||1;cv.style.width=cv.style.height=S+"px";cv.width=cv.height=S*d;cx.setTransform(d,0,0,d,0,0);cx.fillStyle="#000";cx.fillRect(0,0,S,S)}
function idle(){size();cx.fillStyle="#7a1a22";cx.font="600 16px system-ui,sans-serif";cx.textAlign="center";cx.fillText("Rasm tanlang, spiral chiziladi",S/2,S/2)}
function go(){
  if(!img)return;cancelAnimationFrame(raf);size();
  const o=document.createElement("canvas");o.width=o.height=S;const oc=o.getContext("2d");
  const k=Math.max(S/img.width,S/img.height),w=img.width*k,h=img.height*k;
  oc.drawImage(img,(S-w)/2,(S-h)/2,w,h);
  const px=oc.getImageData(0,0,S,S).data;
  const txt=(document.getElementById("t").value||"SEVGI ");
  const GAP=Math.max(3,S/120),STEP=GAP*1.05;
  cx.font=`700 ${Math.max(5,GAP*1.3)}px system-ui,sans-serif`;cx.textAlign="center";cx.textBaseline="middle";
  let th=0,n=0;const c=S/2;
  const frame=()=>{
    for(let q=0;q<(still?1e6:90);q++){
      const r=GAP*th/(2*Math.PI);if(r>c)return;
      const x=c+r*Math.cos(th),y=c+r*Math.sin(th),xi=Math.floor(x),yi=Math.floor(y);
      if(xi>=0&&yi>=0&&xi<S&&yi<S){
        const i=(yi*S+xi)*4,l=(.299*px[i]+.587*px[i+1]+.114*px[i+2])/255,v=Math.pow(l,1.15);
        if(v>.07){cx.save();cx.translate(x,y);cx.rotate(th+Math.PI/2);cx.fillStyle=`rgb(${Math.round(255*v)},${Math.round(55*v)},${Math.round(50*v)})`;cx.fillText(txt[n%txt.length],0,0);cx.restore()}
      }
      n++;th+=STEP/Math.max(r,STEP);
    }
    raf=requestAnimationFrame(frame);
  };
  frame();
}
document.getElementById("f").onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const im=new Image();im.onload=()=>{img=im;go()};im.src=URL.createObjectURL(file);
};
document.getElementById("t").onchange=go;
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>img?go():idle(),250)});
idle();
</script>
</body>
</html>
